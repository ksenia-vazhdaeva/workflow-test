name: Deploy CI/CD

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - 'main'
      - 'environments'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        environment: [ dev, sandbox ]
    uses: ./.github/workflows/echo.yml
    with:
        environment: ${{ matrix.environment }}
