name: Deploy CI/CD

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - 'main'
      - 'environments'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [ dev, sandbox ]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/echo.yml
        with:
          environment: ${{ matrix.environment }}
